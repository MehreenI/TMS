<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="2" y="2" width="28" height="28" rx="6" ry="6" fill="url(#backgroundGradient)" filter="url(#shadow)"/>
  
  <!-- Letter T -->
  <g fill="white">
    <!-- Top horizontal bar of T -->
    <rect x="8" y="9" width="16" height="3" rx="1"/>
    <!-- Vertical bar of T -->
    <rect x="14.5" y="9" width="3" height="14" rx="1"/>
  </g>
</svg>